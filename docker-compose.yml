version: '3.8'
services:
  mysql-db:
    image: mysql:8.0
    container_name: tracking_db
    restart: always
    env_file:
      - .env 
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: